[package]
name = "swiss-qr-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swiss_qr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.1", features = ["runtime-tokio", "sqlite", "chrono"] }
anyhow = "1.0.104"
rand = "0.10.2"
time-format = "1.2.3"
swiss_qrust = "0.2.0"
toml = "1.1.4"
ironpress = "1.5.3"
tera = "2.2.0"
chrono = "0.4.45"
tauri-plugin-process = "2.3.1"

# The updater has no mobile implementation.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"


[dev-dependencies]
# Inflating PDF content streams, to assert on the generated layout.
flate2 = "1.1.9"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
